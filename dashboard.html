<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="navbar">
  <h2>⚡ Elite Dashboard</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="stats">
  <div class="card"><h3>Total Counters</h3><p id="totalCounters">0</p></div>
  <div class="card"><h3>Total Value</h3><p id="totalValue">0</p></div>
</div>

<div class="controls">
  <button onclick="addCounter()">+ Add Counter</button>
</div>

<div id="counterContainer" class="grid"></div>

<!-- Charts -->
<canvas id="chart" style="max-height: 400px; padding: 20px;"></canvas>

<script src="script.js"></script>
</body>
</html>
